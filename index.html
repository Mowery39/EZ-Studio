<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EZ Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <!-- Top bar -->
    <div class="top-bar">
      <h1 class="logo">EZ Studio</h1>
      <button class="info-btn">i</button>
    </div>

    <!-- Main content -->
<div class="main-content">

  <!-- CENTER -->
  <div class="center">

    <!-- Drum -->
    <img id="drum_image" src="drum_frame1.png" alt="drum_frame1" class="drum_frame1" />

    <!-- Main control -->
    <div class="main-control">
      <div class="up-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" width="170" height="61" viewBox="0 0 170 61" fill="none">
          <path d="M127.5 38.125L85 22.875L42.5 38.125"
            stroke="#1E1E1E"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="play-bar"></div>
    </div>

  </div>

  <!-- RIGHT SIDE CONTROLS -->
  <div class="controls">

    <div class="control" id="pitch-control">
      <p>Pitch</p>
      <div class="arrow up" id="pitch-up"></div>
      <span class="value" id="pitch-value">5</span>
      <div class="arrow down" id="pitch-down"></div>
    </div>

    <div class="control" id="volume-control">
      <p>Volume</p>
      <div class="arrow up" id="volume-up"></div>
      <span class="value" id="volume-value">5</span>
      <div class="arrow down" id="volume-down"></div>
    </div>

    <div class="control" id="sound-control">
      <p>Sound</p>
      <div class="arrow up" id="sound-up"></div>
      <span class="value" id="sound-value">Snare</span>
      <div class="arrow down" id="sound-down"></div>
    </div>

  </div>

</div>

<div class="advanced-panel">
  <div class="advanced-arrow">
    <svg xmlns="http://www.w3.org/2000/svg" width="170" height="61" viewBox="0 0 170 61" fill="none">
      <path d="M127.5 38.125L85 22.875L42.5 38.125"
        stroke="#1E1E1E"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
  </div>
  <p>Advanced</p>
</div>
<div class="advanced-content">
  <div class="advanced-buttons">
    <div class="record-btn"></div>
    <div class="play-btn"></div>
    <div class="stop-btn"></div>
    <div class="reset-btn"></div>
  </div>

  <div class="music-grid-window">
    <div class="music-grid"></div>
  </div>

  <div class="advanced-sliders">
    <label>Volume: <span id="advanced-volume-value">50</span></label>
    <input id="advanced-volume" type="range" min="1" max="100" value="50" />

    <label>Pitch: <span id="advanced-pitch-value">50</span></label>
    <input id="advanced-pitch" type="range" min="1" max="100" value="50" />

    <label>Sound: <span id="advanced-sound-value">Snare</span></label>
    <input id="advanced-sound" type="range" min="1" max="8" step="1" value="1" />
  </div>
</div>
<div class="bottom-bar"></div>

  </div>

<div id="tutorial-overlay" class="tutorial-overlay hidden">
    <div class="tutorial-box">

    <span id="tutorial-close">×</span>

    <h2 id="tutorial-title"></h2>
    <p id="tutorial-text"></p>

    <div class="tutorial-buttons">
      <button id="tutorial-back">Back</button>
      <button id="tutorial-next">Next</button>
      <button id="tutorial-exit" class="hidden">Exit</button>
    </div>

  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
